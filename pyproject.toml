[project]
name = "kaspion"
version = "0.1.0"
description = "Local-only, privacy-first household finance pipeline: DuckDB + dbt + AI categorization + Evidence dashboard"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "requests>=2.32",
    "cryptography>=43.0",
    # reading bank/card statement exports uploaded from the dashboard:
    # openpyxl for .xlsx (Isracard), xlrd for legacy OLE2 .xls (ONE ZERO)
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kaspion", "kaspion.ingest", "kaspion.ai"]
