# Verifies the cross-platform work on a REAL x64 Windows box. The developer machine is
# an arm64 Mac, so these paths (LOCALAPPDATA, cp1255 consoles, .venv\Scripts layout,
# node.exe resolution) cannot be exercised locally — only asserted about.
#
# Runs the same gates the macOS side already passes, plus Windows-specific assertions.
name: windows-check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kaspion (pulls Node in via nodejs-wheel)
        run: python -m pip install --quiet -e ".[dev]"

      # Phase 1: data must resolve to %LOCALAPPDATA%\kaspion, never into the source tree.
      - name: Per-user data directory resolves under LOCALAPPDATA
        run: |
          python -c "import os, sys; from pathlib import Path; from kaspion.paths import data_dir, db_path; d = data_dir(); print('data_dir:', d); print('db_path :', db_path()); local = Path(os.environ['LOCALAPPDATA']).resolve(); repo = Path.cwd().resolve(); assert local in d.resolve().parents or d.resolve() == local / 'kaspion', f'not under LOCALAPPDATA: {d}'; assert repo not in d.resolve().parents, f'data dir is inside the source tree: {d}'; print('OK: per-user data dir is outside the repo')"

      # Phase 5: Node must come from the wheel, next to python.exe, with no system Node.
      - name: Bundled Node resolves and is new enough
        run: |
          python -c "import subprocess; from kaspion.ingest.scraper_loader import _node_bin; nb = _node_bin(); print('node bin:', nb); v = subprocess.run([nb, '--version'], capture_output=True, text=True, check=True).stdout.strip(); print('node version:', v); major = int(v.lstrip('v').split('.')[0]); assert major >= 22, f'israeli-bank-scrapers needs Node >= 22.22.2, got {v}'; assert nb.lower().endswith('node.exe'), f'expected node.exe on Windows, got {nb}'; print('OK: bundled node.exe resolved')"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest tests/ -q

      # Phase 3: a brand-new install must produce an EMPTY database and a valid dashboard,
      # with dbt driven through kaspion.pipeline (never a bare `dbt`, which isn't on PATH).
      - name: Clean first run (kaspion init) produces an empty database
        run: |
          python -m kaspion.cli init
          python -c "import duckdb; from kaspion.paths import db_path, report_path; con = duckdb.connect(str(db_path())); n = con.execute('SELECT count(*) FROM raw.transactions').fetchone()[0]; con.close(); print('rows:', n); assert n == 0, f'fresh install is not empty: {n} rows'; p = report_path(); assert p.exists(), 'dashboard.html was not generated'; html = p.read_text(encoding='utf-8'); assert '\"months\": []' in html or '\"months\":[]' in html, 'dashboard does not carry an empty months list'; print('OK: empty database + empty-state dashboard')"

      # Phase 2: Hebrew must survive a Windows console and subprocess pipes (cp1255 is the
      # default there, which previously corrupted every merchant name).
      - name: Hebrew survives subprocess pipes
        run: |
          python -c "import subprocess, sys; out = subprocess.run([sys.executable, '-c', 'print(\"בדיקה ₪ ✔\")'], capture_output=True, text=True, encoding='utf-8', check=True).stdout.strip(); print('round-tripped:', out); assert out == 'בדיקה ₪ ✔', f'Hebrew corrupted through the pipe: {out!r}'; print('OK: Hebrew round-trips')"

      # Phase 3a: the demo dataset must not be loadable by accident, and its CSV path
      # (with Windows backslashes) must survive being bound into DuckDB SQL.
      - name: Seed loader handles Windows paths
        run: |
          python -m kaspion.ingest.generate_seed
          python sync.py --source seed --skip-categorize
          python -c "import duckdb; from kaspion.paths import db_path; con = duckdb.connect(str(db_path())); n = con.execute('SELECT count(*) FROM raw.transactions').fetchone()[0]; con.close(); print('rows after explicit seed load:', n); assert n > 0, 'seed load failed on a Windows path'; print('OK: backslash path bound into SQL correctly')"

      - name: Frontend syntax
        run: node --check kaspion/assets/app.js
